<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Label implicita inativa e label explicita inativa</title>

    <style>
    body {
        background: #fff;
        color: #000;
    }

    label {
        color: #999;
    }
    </style>

</head>

<body>
    <p>início do <a href="#">teste</a></p>
    
    <h2>Label implicita e explicita inativa</h2>
    
    <label for="test1">
        <input id="test1" type="checkbox" disabled>
        <span>Checked and disabled checkbox</span>
    </label>
    
    <h2>Label explicita inativa</h2>
    
    <input id="test2" type="checkbox" disabled>
    <label for="test2">
        <span>Checked and disabled checkbox</span>
    </label>
    
    <h2>Label implicita inativa</h2>
    
    <label>
        <input id="test3" type="checkbox" disabled>
        <span>Checked and disabled checkbox</span>
    </label>

    <h2>Label sem span</h2>

    <label>
        <input id="test4" type="checkbox" disabled>
        Checked and disabled checkbox
    </label>


    <h2>Ui! Será? Será que só o type text é inaplicable?</h2>
    <label for="test1">
        <span>Text disabled is inaplicable?</span>
        <input id="test1" type="text" disabled>
    </label>


    
    <p>fim do <a href="#">teste</a></p>
</body>

</html>
